name: Build KK Installer

# Builds the KK Installer phone app (installer/ folder), publishes it as a release
# in this repo, and points the 🛠️ KK Installer card on the store page at it.

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'installer/**'
      - '.github/workflows/build-installer.yml'

permissions:
  contents: write

concurrency:
  group: installer-build
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Version
        run: |
          N=${{ github.run_number }}
          echo "VERSION_CODE=$N" >> "$GITHUB_ENV"
          echo "VERSION_NAME=1.$N" >> "$GITHUB_ENV"
          echo "VER=1.$N" >> "$GITHUB_ENV"

      - name: Signing key
        env:
          APP_KEYSTORE: ${{ secrets.APP_KEYSTORE }}
        run: |
          if [ -z "$APP_KEYSTORE" ]; then
            echo "::error::The APP_KEYSTORE secret is missing (Settings > Secrets and variables > Actions)."
            exit 1
          fi
          echo "$APP_KEYSTORE" | base64 -d > "$RUNNER_TEMP/release.jks"
          echo "KS_FILE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build APK
        working-directory: installer
        env:
          # Same signing key as the Dartball Scorebook build.
          KS_PASS: dartball-scorebook
          KS_ALIAS: scorebook
        run: gradle --no-daemon assembleRelease

      - name: Name the APK
        run: |
          mkdir -p dist
          cp installer/app/build/outputs/apk/release/app-release.apk "dist/KK-Installer-v$VER.apk"
          ls -la dist

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: kk-installer-v${{ env.VER }}
          name: KK Installer ${{ env.VER }}
          target_commitish: ${{ github.sha }}
          body: |
            Install, uninstall and run ADB commands on Fire TV / Fire Stick and onn / Google TV
            straight from an Android phone over Wi-Fi. No PC needed.
            Install over the previous version; saved devices are kept.
          files: dist/*.apk

      - name: Update store card
        run: |
          set -euo pipefail
          git fetch -q origin main
          git checkout -q -B main origin/main
          python3 - <<'PY'
          import os, re, pathlib
          ver = os.environ["VER"]
          url = f"https://github.com/kablekillers/Kable-Killers-Store/releases/download/kk-installer-v{ver}/KK-Installer-v{ver}.apk"
          f = pathlib.Path("index.html")
          html = f.read_text()
          html, a = re.subn(r'(id="kk-installer-card"\s*href=")[^"]+', lambda m: m.group(1) + url, html)
          html, b = re.subn(r'(<span id="kk-installer-version">)[^<]*', lambda m: m.group(1) + "Version " + ver, html)
          if a != 1 or b != 1:
              raise SystemExit("KK Installer card not found on the store page")
          f.write_text(html)
          print(f"Store card now points to {url}")
          PY
          if git diff --quiet -- index.html; then echo "Store page unchanged."; exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "chore(store): KK Installer $VER"
          for i in 1 2 3; do git push && exit 0; git pull -q --rebase origin main; done
          exit 1
