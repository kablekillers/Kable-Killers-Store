<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Dartball Scorebook</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Barlow:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0f1512; --bg2:#161e1a; --card:#1c2621; --line:#2a3731; --text:#eef3ef; --muted:#9aaba2;
  --accent:#f0772e; --accent2:#ffb37d; --green:#8fd0a5; --blue:#5b84c4; --danger:#e5534b; --ok:#4fbf7d;
  --chip:#24302a; --shadow:0 6px 24px rgba(0,0,0,.35);
  --radius:14px;
}
:root.light{
  --bg:#f3f1ea; --bg2:#ebe8de; --card:#ffffff; --line:#ddd8ca; --text:#1b231f; --muted:#5f6b64;
  --chip:#eeeae0; --shadow:0 4px 18px rgba(30,40,30,.12);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--text);font-family:Barlow,system-ui,-apple-system,Segoe UI,Roboto,sans-serif;font-size:16px}
body{padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);min-height:100vh}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer}
input,select{font:inherit;color:var(--text);background:var(--bg2);border:1px solid var(--line);border-radius:10px;padding:10px 12px;width:100%}
h1,h2,h3,.cond{font-family:"Barlow Condensed","Roboto Condensed",sans-serif-condensed,Barlow,sans-serif;letter-spacing:.02em}
h1{font-size:30px;margin:0}
h2{font-size:22px;margin:0 0 10px}
h3{font-size:18px;margin:0 0 8px;color:var(--muted);text-transform:uppercase;letter-spacing:.08em;font-weight:600}
.wrap{max-width:760px;margin:0 auto;padding:12px 14px 96px}
.top{display:flex;align-items:center;gap:10px;padding:6px 0 12px}
.top .title{flex:1;font-family:"Barlow Condensed","Roboto Condensed",sans-serif-condensed;font-size:22px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.iconbtn{width:42px;height:42px;border-radius:12px;background:var(--card);display:grid;place-items:center;font-size:20px;border:1px solid var(--line)}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:14px;margin-bottom:12px;box-shadow:var(--shadow)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:12px 16px;border-radius:12px;background:var(--chip);border:1px solid var(--line);font-weight:600;min-height:46px}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#1a0d04}
.btn.ghost{background:transparent}
.btn.danger{color:var(--danger)}
.btn.block{width:100%}
a.btn{text-decoration:none}
.btn.sm{min-height:36px;padding:6px 12px;font-size:14px}
.row{display:flex;gap:10px;align-items:center}
.row > *{min-width:0}
.grow{flex:1}
.muted{color:var(--muted)}
.small{font-size:13px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.list .item{display:flex;align-items:center;gap:10px;padding:12px 4px;border-bottom:1px solid var(--line)}
.list .item:last-child{border-bottom:0}
.pill{display:inline-block;padding:2px 8px;border-radius:99px;background:var(--chip);font-size:12px;color:var(--muted);border:1px solid var(--line)}
.pill.live{background:var(--accent);color:#1a0d04;border-color:var(--accent)}
.hero{background:linear-gradient(135deg,#1f3a2c,#13201a);border-color:#2c4a3a;color:#eef3ef}
:root.light .hero{background:linear-gradient(135deg,#2f6b4b,#1f4a35);color:#fff}
.hero .muted{color:#b8cfc1}
.bigscore{font-family:"Barlow Condensed","Roboto Condensed",sans-serif-condensed;font-size:44px;font-weight:700;line-height:1}
label.f{display:block;margin:10px 0 4px;font-size:13px;color:var(--muted);font-weight:600;text-transform:uppercase;letter-spacing:.06em}

/* scoreboard */
.sb{overflow-x:auto;-webkit-overflow-scrolling:touch}
.sb table{border-collapse:collapse;width:100%;font-family:"Barlow Condensed","Roboto Condensed",sans-serif-condensed;font-size:18px}
.sb th,.sb td{padding:3px 3px;text-align:center;min-width:19px}
.sb th{color:var(--muted);font-weight:600;font-size:14px}
.sb td.tn{text-align:left;max-width:92px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:600}
.sb td.r{font-weight:700;font-size:22px;color:var(--accent2)}
.sb tr.bat td.tn::before{content:"▸ ";color:var(--accent)}
.sb td.cur{background:rgba(240,119,46,.15);border-radius:6px}

.status{display:flex;align-items:center;gap:14px;justify-content:space-between}
.inn{font-family:"Barlow Condensed","Roboto Condensed",sans-serif-condensed;font-size:26px;font-weight:700}
.dots{display:flex;gap:5px;align-items:center}
.dot{width:13px;height:13px;border-radius:50%;border:2px solid var(--muted)}
.dot.on{background:var(--accent);border-color:var(--accent)}
.dot.b.on{background:var(--green);border-color:var(--green)}
.cnt{font-family:"Barlow Condensed","Roboto Condensed",sans-serif-condensed;font-size:15px;color:var(--muted);display:flex;flex-direction:column;gap:4px}
.cnt .row{gap:6px}
.mini{width:58px;height:58px}
.batter{display:flex;align-items:center;gap:12px}
.batter .num{font-family:"Barlow Condensed","Roboto Condensed",sans-serif-condensed;font-size:34px;font-weight:700;color:var(--accent);width:40px;text-align:center}
.batter .nm{font-family:"Barlow Condensed","Roboto Condensed",sans-serif-condensed;font-size:26px;font-weight:700;line-height:1.05}
.dueup{font-size:13px;color:var(--muted)}

.boardwrap{position:relative;margin:4px auto 8px;max-width:440px}
.board{width:100%;height:auto;display:block;touch-action:manipulation;user-select:none}
.board [data-r]{cursor:pointer;transition:filter .12s}
.board [data-r]:active{filter:brightness(1.25)}
.board text{pointer-events:none;font-family:"Barlow Condensed","Roboto Condensed",sans-serif-condensed,sans-serif;font-weight:700}
.flash{position:absolute;inset:0;display:grid;place-items:center;pointer-events:none}
.flash span{background:rgba(0,0,0,.78);color:#fff;font-family:"Barlow Condensed","Roboto Condensed",sans-serif-condensed;font-weight:700;font-size:30px;padding:10px 22px;border-radius:14px;opacity:0;transform:scale(.8);transition:all .15s}
.flash span.show{opacity:1;transform:scale(1)}

.chips{display:flex;flex-wrap:wrap;gap:6px;justify-content:center}
.chip{padding:9px 11px;border-radius:10px;background:var(--chip);border:1px solid var(--line);font-family:"Barlow Condensed","Roboto Condensed",sans-serif-condensed;font-weight:700;font-size:17px;min-width:46px}
.chip.hit{background:#f4f1e8;color:#222;border-color:#d8d2c0}
.chip.out{background:#f07a2e;color:#1a0d04;border-color:#f07a2e}
.chip.ball{background:#5b84c4;color:#fff;border-color:#5b84c4}
.chip.str{background:#9aa3ab;color:#15191c;border-color:#9aa3ab}
.chip.foul{background:#8fd0a5;color:#0f2a19;border-color:#8fd0a5}
.chip.red{background:#c9464a;color:#fff;border-color:#c9464a}

.actionbar{position:fixed;left:0;right:0;bottom:0;background:var(--bg2);border-top:1px solid var(--line);padding:10px 14px calc(10px + env(safe-area-inset-bottom));display:flex;gap:8px;justify-content:center;z-index:5}
.actionbar .btn{flex:1;max-width:240px}
.lastplay{text-align:center;font-size:14px;color:var(--muted);min-height:20px;margin:4px 0}

/* lineup editor */
.tabs{display:flex;background:var(--bg2);border-radius:12px;padding:4px;gap:4px;margin-bottom:12px;border:1px solid var(--line)}
.tabs button{flex:1;padding:10px;border-radius:9px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tabs button.on{background:var(--card);box-shadow:var(--shadow);color:var(--accent2)}
.lu{list-style:none;margin:0;padding:0}
.lu li{display:flex;align-items:center;gap:6px;background:var(--bg2);border:1px solid var(--line);border-radius:12px;padding:6px 6px 6px 4px;margin-bottom:6px;touch-action:pan-y}
.lu li.dragging{opacity:.85;box-shadow:var(--shadow);border-color:var(--accent);background:var(--card)}
.lu li.due{border-color:var(--accent)}
.lu .h{width:34px;height:40px;display:grid;place-items:center;color:var(--muted);font-size:20px;touch-action:none;cursor:grab}
.lu .n{width:26px;font-family:"Barlow Condensed","Roboto Condensed",sans-serif-condensed;font-weight:700;font-size:20px;color:var(--accent);text-align:center}
.lu .nm{flex:1;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.lu .mb{width:36px;height:38px;border-radius:9px;background:var(--chip);border:1px solid var(--line);font-size:15px}
.bench{display:flex;flex-wrap:wrap;gap:6px}
.bench button{padding:8px 12px;border-radius:99px;background:var(--chip);border:1px dashed var(--muted);font-weight:500}

/* stats table */
.st{overflow-x:auto}
.st table{border-collapse:collapse;font-size:14px;width:100%}
.st th,.st td{padding:7px 6px;text-align:right;white-space:nowrap;border-bottom:1px solid var(--line)}
.st th{color:var(--muted);font-weight:600;font-size:12px;text-transform:uppercase;position:sticky;top:0;background:var(--card)}
.st td:first-child,.st th:first-child{text-align:left;position:sticky;left:0;background:var(--card);max-width:130px;overflow:hidden;text-overflow:ellipsis}
.st tr.tot td{font-weight:700;border-top:2px solid var(--line)}

/* sheet */
.ov{position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:20;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--card);width:100%;max-width:560px;border-radius:20px 20px 0 0;padding:18px 16px calc(18px + env(safe-area-inset-bottom));max-height:88vh;overflow:auto;border:1px solid var(--line)}
@media(min-width:700px){.ov{align-items:center}.sheet{border-radius:20px}}
.toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%);background:#111;color:#fff;padding:10px 16px;border-radius:12px;z-index:30;font-size:14px;box-shadow:var(--shadow);display:flex;gap:12px;align-items:center}
.toast button{color:var(--accent2);font-weight:700}
.sync{font-size:12px;color:var(--muted)}

/* landscape game layout */
@media (orientation:landscape) and (min-width:700px){
  .gamegrid{display:grid;grid-template-columns:minmax(300px,440px) 1fr;gap:14px;align-items:start}
  .boardwrap{margin-top:0}
}

/* ===== game layout: portrait (stacked) ===== */
.ell{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.game{max-width:760px;margin:0 auto;padding:12px 14px 96px;display:grid;grid-template-columns:minmax(0,1fr);
  grid-template-areas:"top" "sb" "info" "deck" "board" "chips" "last"}
.g-deck{grid-area:deck;padding:8px 12px}
.deck{display:flex;gap:8px;align-items:baseline;font-size:14px;line-height:1.5}
.deck .who{color:var(--muted);flex:none;max-width:42%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.deck .ps{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.deck .ho{color:var(--accent2);font-weight:700;font-family:"Barlow Condensed","Roboto Condensed",sans-serif-condensed}
.deck.batting .who{color:var(--text)}
.g-top{grid-area:top}.g-sb{grid-area:sb;padding:10px 10px 6px}.g-info{grid-area:info}.g-board{grid-area:board}
.g-chips{grid-area:chips;display:flex;flex-direction:column;gap:6px}.g-last{grid-area:last}
.g-status{display:flex;align-items:center;gap:14px;justify-content:space-between;padding:10px 14px}
.batter{width:100%;text-align:left}
.lcols{display:grid;grid-template-columns:1fr 1fr;gap:14px;align-items:start}
.lhead{display:flex;align-items:center;gap:8px;margin-bottom:8px}.lhead .cond{font-size:22px;font-weight:700}
.qs{flex-wrap:wrap;gap:8px;margin-bottom:12px}
.lwrap{max-width:1100px}

/* ===== landscape phone & tablet: everything on one screen ===== */
@media (orientation:landscape) and (min-width:600px){
  .game{--bs:min(calc(100dvh - 16px - env(safe-area-inset-top) - env(safe-area-inset-bottom)), 58vw);
    max-width:none;height:calc(100dvh - env(safe-area-inset-top) - env(safe-area-inset-bottom));padding:8px 12px;overflow:hidden;
    grid-template-columns:minmax(0,1fr) var(--bs);column-gap:14px;
    grid-template-rows:auto auto auto auto auto auto 1fr auto;
    grid-template-areas:"top board" "sb board" "info board" "deck board" "chips board" "last board" ". board" "act board"}
  .g-deck{padding:4px 10px}
  .deck{font-size:12.5px;line-height:1.45}
  .game .card{margin-bottom:6px;padding:8px 10px;box-shadow:none}
  .game .top{padding:0 0 6px}.game .top .title{font-size:19px}.game .iconbtn{width:36px;height:36px;font-size:18px}
  .g-board{align-self:center;justify-self:center;width:var(--bs)}
  .g-board .boardwrap{max-width:none;width:var(--bs);margin:0}
  .g-info{display:grid;grid-template-columns:auto minmax(0,1fr);gap:6px}
  .g-status{gap:10px;padding:6px 10px}
  .inn{font-size:22px}.mini{width:46px;height:46px}.dot{width:11px;height:11px}.cnt{gap:2px;font-size:13px}
  .batter{gap:8px}.batter .num{font-size:26px;width:28px}.batter .nm{font-size:21px}
  .chips{flex-wrap:nowrap;gap:5px}.chip{flex:1;min-width:0;padding:7px 2px;font-size:15px}
  .g-last{margin:2px 0;font-size:13px;min-height:16px}
  .g-act{grid-area:act;position:static;background:none;border:0;padding:0;justify-content:stretch}
  .g-act .btn{max-width:none;min-height:40px;padding:8px}
  .hide-xs{display:none}
  .game.is-final{grid-template-areas:"top board" "sb board" "last board" ". board" "act board";grid-template-rows:auto auto auto 1fr auto}
  .game.is-final .g-board .card{margin:0}
}
/* short landscape screens (phones): squeeze so everything fits */
@media (orientation:landscape) and (min-width:600px) and (max-height:559px){
  .game{padding:6px 10px}
  .game .card{margin-bottom:4px;padding:5px 8px}
  .game .top{padding:0 0 4px}.game .iconbtn{width:32px;height:32px}.game .top .title{font-size:17px}
  .sb table{font-size:15px}.sb th,.sb td{padding:0 3px}.sb td.r{font-size:18px}.sb th{font-size:12px}
  .g-status{padding:4px 8px;gap:8px}.inn{font-size:19px}.mini{width:38px;height:38px}.dot{width:9px;height:9px}.cnt{font-size:11px;gap:1px}
  .batter .num{font-size:22px;width:24px}.batter .nm{font-size:18px}.batter .small{font-size:11px}
  .g-deck{padding:3px 8px}.deck{font-size:12px;line-height:1.35}
  .chip{padding:5px 2px;font-size:14px}.g-chips{gap:4px}
  .g-last{display:none}
  .g-act .btn{min-height:34px;padding:4px;font-size:14px}
}
/* roomier landscape (tablets) */
@media (orientation:landscape) and (min-width:600px) and (min-height:560px){
  .game{column-gap:22px;padding:14px 18px;--bs:min(calc(100dvh - 28px - env(safe-area-inset-top) - env(safe-area-inset-bottom)), 54vw)}
  .g-info{grid-template-columns:1fr;gap:0}
  .g-status{justify-content:space-between;padding:10px 18px}
  .game .card{padding:12px 14px;margin-bottom:10px}
  .game .top .title{font-size:24px}.game .iconbtn{width:44px;height:44px}
  .sb table{font-size:22px}.sb td.r{font-size:26px}.sb th{font-size:15px}
  .inn{font-size:30px}.mini{width:64px;height:64px}.dot{width:15px;height:15px}.cnt{font-size:16px;gap:5px}
  .batter .num{font-size:38px;width:44px}.batter .nm{font-size:30px}.dueup{font-size:15px}
  .chips{gap:8px}.chip{padding:13px 4px;font-size:20px;border-radius:12px}
  .g-chips{gap:8px}
  .g-last{font-size:16px}
  .g-deck{padding:10px 14px}
  .deck{font-size:16px;line-height:1.5;flex-direction:column;gap:0;margin-bottom:4px}
  .deck .who{max-width:none;font-size:13px;text-transform:uppercase;letter-spacing:.06em}
  .deck .ps{white-space:normal}
  .g-act .btn{min-height:54px;font-size:18px}
  .hide-xs{display:inline-flex}
}
.night{font-family:"Barlow Condensed","Roboto Condensed",sans-serif-condensed;color:var(--accent2);font-weight:700;margin-left:6px;padding:0 8px;border-radius:8px;background:rgba(240,119,46,.14);font-size:.85em;vertical-align:middle}
</style>
</head>
<body>
<div id="app"></div>
<div id="layer"></div>

<script id="engine">
/* ===== Scoring engine (pure functions over a game object) ===== */
const RESULTS = {
  B:{label:'Ball'}, S:{label:'Strike'}, F:{label:'Foul'},
  OUT:{label:'Out', pa:true, ab:true, out:1},
  Z:{label:'Zero', pa:true, ab:true, out:1},
  K:{label:'Strikeout', pa:true, ab:true, out:1},
  BB:{label:'Walk', pa:true},
  '1B':{label:'Single', pa:true, ab:true, hit:true, bat:1, adv:1},
  '2B':{label:'Double', pa:true, ab:true, hit:true, bat:2, adv:2},
  '3B':{label:'Triple', pa:true, ab:true, hit:true, bat:3, adv:3},
  HR:{label:'Home Run', pa:true, ab:true, hit:true, bat:4, adv:4},
  '2BS':{label:'Two-Base Single', pa:true, ab:true, hit:true, bat:1, adv:2},
  OB:{label:'Off Board', pa:true, ab:true, out:1},
  SH:{label:'Sacrifice Fly', pa:true, out:1},
  DP:{label:'Double Play', pa:true, ab:true, out:1},
  CC:{label:'Chicken Coop', pa:true}
};
const DEFAULT_SETTINGS = {innings:9, games:3, strikesForK:3, ballsForWalk:4,
  foulRule:'b', zeroRule:'out', ccEffect:'OUT', sacRule:'fly', rulesV:2, ccShort:'CC', ccName:'Chicken Coop', theme:'dark'};

function deep(o){return JSON.parse(JSON.stringify(o))}
function newGame(n, awayId, homeId, awayLineup, homeLineup){
  return {n, awayId, homeId, status:'lineup', inning:1, half:0, outs:0, balls:0, strikes:0,
    bases:[null,null,null], score:{away:[], home:[]},
    lineup:{away:awayLineup.slice(), home:homeLineup.slice()},
    next:{away:0, home:0}, pas:[], undo:[], final:null};
}
function battingKey(g){return g.half===0?'away':'home'}
function currentBatter(g){const k=battingKey(g), L=g.lineup[k]; return L.length? L[g.next[k]%L.length] : null}
function dueUp(g, k, count){const L=g.lineup[k]; const out=[]; for(let i=0;i<count&&L.length;i++) out.push(L[(g.next[k]+i)%L.length]); return out}
function totals(g){const s=a=>a.reduce((x,y)=>x+(y||0),0); return {away:s(g.score.away), home:s(g.score.home)}}
function snapshot(g){const c=deep(g); delete c.undo; return c}
function pushUndo(g, label){g.undo.push({label, state:snapshot(g)}); if(g.undo.length>300) g.undo.shift()}
function undo(g){const u=g.undo.pop(); if(!u) return null; const keep=g.undo; Object.assign(g, u.state); g.undo=keep; return u.label}

/* settings-dependent mapping of the CC result */
function ccMapped(settings){return settings.ccEffect||'1B'}

function apply(g, code, settings){
  settings = Object.assign({}, DEFAULT_SETTINGS, settings||{});
  if(g.status!=='live') return null;
  const batter = currentBatter(g); if(!batter) return null;
  pushUndo(g, code);
  if(code==='B'){ g.balls++; if(g.balls>=settings.ballsForWalk) return completePA(g, 'BB', batter, settings); return {pitch:'Ball'} }
  if(code==='S'){ g.strikes++; if(g.strikes>=settings.strikesForK) return completePA(g, 'K', batter, settings); return {pitch:'Strike'} }
  if(code==='F'){
    if(settings.foulRule==='n') return {pitch:'Foul'};
    if(settings.foulRule==='b' && g.strikes>=settings.strikesForK-1) return {pitch:'Foul'};
    g.strikes++; if(g.strikes>=settings.strikesForK) return completePA(g, 'K', batter, settings);
    return {pitch:'Foul (strike)'};
  }
  if(code==='Z' && settings.zeroRule==='none'){ return {pitch:'Zero'} }
  return completePA(g, code, batter, settings);
}

function completePA(g, code, batter, settings){
  const k = battingKey(g);
  const eff = code==='CC' ? ccMapped(settings) : code;
  const R = RESULTS[eff];
  const runs = [];
  let b = g.bases.slice();
  let outsAdded = 0;
  if(R.hit){
    const nb=[null,null,null];
    for(let i=2;i>=0;i--){ if(b[i]==null) continue; const p=i+1+R.adv; if(p>=4) runs.push(b[i]); else nb[p-1]=b[i]; }
    if(R.bat>=4) runs.push(batter); else nb[R.bat-1]=batter;
    b=nb;
  } else if(eff==='BB'){
    if(b[0]!=null){ if(b[1]!=null){ if(b[2]!=null) runs.push(b[2]); b[2]=b[1]; } b[1]=b[0]; }
    b[0]=batter;
  } else if(eff==='SH'){
    outsAdded=1;
    if(g.outs+1<3){
      if(settings.sacRule==='all'){ const nb=[null,null,null]; for(let i=2;i>=0;i--){ if(b[i]==null) continue; if(i===2) runs.push(b[i]); else nb[i+1]=b[i]; } b=nb; }
      else if(b[2]!=null){ runs.push(b[2]); b[2]=null; }
    }
  } else if(eff==='DP'){
    outsAdded=1;
    if(g.outs+1<3){ const idx = b[0]!=null?0 : b[1]!=null?1 : b[2]!=null?2 : -1; if(idx>=0){ b[idx]=null; outsAdded=2; } }
  } else { outsAdded = R.out||1; }
  g.outs += outsAdded;
  g.bases = b;
  const inningIdx = g.inning-1;
  while(g.score[k].length<=inningIdx) g.score[k].push(0);
  g.score[k][inningIdx] += runs.length;
  const pa = {k, pid:batter, r:code, eff, rbi: (eff==='DP')?0:runs.length, runs, inn:g.inning, half:g.half, outs:outsAdded};
  g.pas.push(pa);
  g.balls=0; g.strikes=0;
  g.next[k] = (g.next[k]+1) % Math.max(1,g.lineup[k].length);
  const t = totals(g);
  // walk-off
  if(g.half===1 && g.inning>=settings.innings && t.home>t.away){ finish(g); return {pa, ended:true}; }
  if(g.outs>=3) endHalf(g, settings);
  return {pa, ended: g.status==='final'};
}

function endHalf(g, settings){
  const t = totals(g);
  g.outs=0; g.balls=0; g.strikes=0; g.bases=[null,null,null];
  if(g.half===0){
    while(g.score.away.length<g.inning) g.score.away.push(0);
    if(g.inning>=settings.innings && t.home>t.away){ finish(g); return; }
    g.half=1;
  } else {
    while(g.score.home.length<g.inning) g.score.home.push(0);
    if(g.inning>=settings.innings && t.home!==t.away){ finish(g); return; }
    g.inning++; g.half=0;
  }
}
function finish(g){ g.status='final'; const t=totals(g); g.final={away:t.away, home:t.home} }

/* Lineup edits during a game: the player who is due up stays due up. Stats follow player ids, never slots. */
function setLineup(g, k, newOrder){
  const L = g.lineup[k];
  const due = L.length ? L[g.next[k]%L.length] : null;
  const dueIdxOld = g.next[k]%Math.max(1,L.length);
  g.lineup[k] = newOrder.slice();
  let idx = newOrder.indexOf(due);
  if(idx<0){ // due batter was removed/replaced: whoever now holds that slot is up
    idx = Math.min(dueIdxOld, Math.max(0,newOrder.length-1));
  }
  g.next[k] = idx;
}

/* Rotate a lineup so it starts with the player who was due up when the previous game ended. */
/* Lineup a team used in a game, whichever side it batted on */
function lineupFor(game, tid){ return (game.awayId===tid ? game.lineup.away : game.homeId===tid ? game.lineup.home : []).slice() }
function sideOf(game, tid){ return game.awayId===tid ? 'away' : 'home' }
/* Home team bats last in odd games; teams switch sides in even games */
function sidesForGame(n, matchAwayId, matchHomeId){ return n%2===0 ? {awayId:matchHomeId, homeId:matchAwayId} : {awayId:matchAwayId, homeId:matchHomeId} }
/* Hits and outs for one batter across a set of games (walks count as neither) */
function hitsOuts(games, pid){ let h=0,o=0; for(const g of games) for(const pa of g.pas){ if(pa.pid!==pid) continue; const R=RESULTS[pa.eff]; if(R.hit) h++; else if(pa.eff!=='BB') o++; } return {h,o} }
function continueOrder(prevGame, k){
  const L = prevGame.lineup[k]; if(!L.length) return [];
  const s = prevGame.next[k]%L.length;
  return L.slice(s).concat(L.slice(0,s));
}

/* Stats from plate appearances. games: [{game, teamOf:{away:id,home:id}}] */
function emptyLine(){return {G:0,PA:0,AB:0,H:0,'1B':0,'2B':0,'3B':0,HR:0,'2BS':0,CC:0,BB:0,K:0,SH:0,DP:0,R:0,RBI:0}}
function statLines(games, teamId){
  const lines = {};
  const get = pid => lines[pid] || (lines[pid]=emptyLine());
  for(const g of games){
    const key = g.awayId===teamId ? 'away' : g.homeId===teamId ? 'home' : null;
    if(!key || g.status==='lineup') continue;
    const seen = new Set();
    for(const pid of g.lineup[key]) seen.add(pid);
    for(const pa of g.pas){
      if(pa.k!==key) continue;
      seen.add(pa.pid);
      const l = get(pa.pid), R = RESULTS[pa.eff];
      l.PA++; if(R.ab) l.AB++; if(R.hit) l.H++;
      if(pa.r==='CC') l.CC++; else if(l[pa.r]!==undefined && pa.r!=='Z' && pa.r!=='OUT') l[pa.r]++;
      l.RBI += pa.rbi;
      for(const rp of pa.runs) get(rp).R++;
    }
    for(const pid of seen) get(pid).G++;
  }
  return lines;
}
function avg(l){ if(!l.AB) return '.000'; const v=(l.H/l.AB); return v>=1? v.toFixed(3) : v.toFixed(3).replace(/^0/,'') }

if(typeof module!=='undefined') module.exports={lineupFor,sideOf,sidesForGame,hitsOuts,RESULTS,DEFAULT_SETTINGS,newGame,apply,undo,currentBatter,dueUp,totals,setLineup,continueOrder,statLines,avg,battingKey};

<script>
/* ===== State & persistence ===== */
const LS_KEY='dartball-scorebook-v1';
const APP=!!window.AndroidApp;
let S = load() || fresh();
let view = {name:'home'};
let cloud = {db:null, uid:null, status:'local', timer:null, writing:false, pending:false};

function uid(){return Math.random().toString(36).slice(2,9)+Date.now().toString(36).slice(-4)}
function fresh(){return {v:1, savedAt:0, settings:deep(DEFAULT_SETTINGS), teams:{}, matches:{}, currentMatchId:null}}
function load(){try{const s=localStorage.getItem(LS_KEY); if(!s) return null; const o=JSON.parse(s); o.settings=Object.assign(deep(DEFAULT_SETTINGS),o.settings||{}); migrate(o.settings); return o}catch(e){return null}}
function migrate(st){ if((st.rulesV||0)<2){ st.ccEffect='OUT'; st.sacRule='fly'; st.rulesV=2 } }
function save(){
  S.savedAt=Date.now();
  try{localStorage.setItem(LS_KEY, JSON.stringify(S))}catch(e){}
  queueCloud();
}
function settings(){return S.settings}
function team(id){return S.teams[id]}
function teamName(id){return (S.teams[id]||{}).name||'—'}
function playerIndex(){const m={}; for(const t of Object.values(S.teams)) for(const p of t.players) m[p.id]=p; return m}
function pname(pid){const p=playerIndex()[pid]; return p?p.name:'?'}
function curMatch(){return S.currentMatchId? S.matches[S.currentMatchId] : null}
function curGame(m){m=m||curMatch(); return m? m.games[m.games.length-1] : null}
function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function applyTheme(){document.documentElement.classList.toggle('light', settings().theme==='light')}
function ccLabel(){return settings().ccShort||'CC'}
function resLabel(code){ if(code==='CC') return settings().ccName||'Chicken Coop'; if(code==='Z') return 'Out'; return (RESULTS[code]||{}).label||code }

/* ---- cloud backup into this viewer's private store ---- */
async function initCloud(){
  try{
    if(!window.claude||!window.claude.use) return;
    const [db,user] = await Promise.all([claude.use('db'), claude.use('user')]);
    if(!db||!user) return;
    const id = await user.id(); if(!id) return;
    cloud.db=db; cloud.uid=id; setSync('checking');
    const timer=setTimeout(()=>setSync('offline'),10000);
    const snap = await db.collection('data/users/'+id).get();
    clearTimeout(timer);
    let core=null; const matches={};
    for(const d of snap.docs){ const v=d.data(); if(d.id==='core') core=v; else if(d.id.startsWith('m_') && v && v.match) matches[v.match.id]=v.match; }
    if(core && core.savedAt > (S.savedAt||0)){
      const local=S.matches;
      S = {v:1, savedAt:core.savedAt, settings:(st=>{migrate(st);return st})(Object.assign(deep(DEFAULT_SETTINGS),core.settings||{})), teams:core.teams||{}, matches:{}, currentMatchId:core.currentMatchId||null};
      for(const [mid,m] of Object.entries(matches)){ const lm=local[mid]; if(lm && lm.savedAt>(m.savedAt||0)) S.matches[mid]=lm; else { for(const g of m.games) g.undo=g.undo||[]; S.matches[mid]=m } }
      try{localStorage.setItem(LS_KEY, JSON.stringify(S))}catch(e){}
      applyTheme(); render(); toast('Loaded your saved scorebook');
    } else if(!core && S.savedAt){ queueCloud(true) }
    setSync('saved');
  }catch(e){ setSync('local') }
}
function setSync(s){cloud.status=s; const el=document.getElementById('sync'); if(el) el.textContent=syncText()}
function syncText(){return {local:'Saved on this device', checking:'Checking cloud copy…', saved:'Saved to your account', saving:'Saving…', offline:'Offline — saved on this device', error:'Cloud save failed — saved on this device'}[cloud.status]||''}
function queueCloud(all){
  if(!cloud.db) return;
  if(all) cloud.all=true;
  clearTimeout(cloud.timer); cloud.timer=setTimeout(flushCloud, 1200);
}
async function flushCloud(){
  if(!cloud.db) return;
  if(cloud.writing){cloud.pending=true; return}
  cloud.writing=true; setSync('saving');
  try{
    const col=cloud.db.collection('data/users/'+cloud.uid);
    await col.doc('core').set({savedAt:S.savedAt, settings:S.settings, teams:S.teams, currentMatchId:S.currentMatchId});
    const ids = cloud.all ? Object.keys(S.matches) : (S.currentMatchId?[S.currentMatchId]:[]);
    cloud.all=false;
    for(const mid of ids){ const m=S.matches[mid]; if(!m) continue; const c=deep(m); for(const g of c.games) delete g.undo; c.savedAt=S.savedAt; await col.doc('m_'+mid).set({match:c}); }
    setSync('saved');
  }catch(e){ setSync('error') }
  cloud.writing=false;
  if(cloud.pending){cloud.pending=false; flushCloud()}
}
async function cloudDeleteMatch(mid){ if(!cloud.db) return; try{ await cloud.db.collection('data/users/'+cloud.uid).doc('m_'+mid).delete() }catch(e){} }

/* ===== UI helpers ===== */
const $app=document.getElementById('app'), $layer=document.getElementById('layer');

function sheet(html, onMount){

}
function closeSheet(){$layer.innerHTML=''}
function ask(title, body, okLabel, onOk, danger){

    el.querySelector('[data-x]').onclick=closeSheet;
    el.querySelector('[data-ok]').onclick=()=>{closeSheet(); onOk()};

}
let toastT;
function toast(msg, actionLabel, action){
  document.querySelectorAll('.toast').forEach(t=>t.remove());
  const t=document.createElement('div'); t.className='toast'; t.innerHTML=`<span>${esc(msg)}</span>${actionLabel?`<button>${esc(actionLabel)}</button>`:''}`;
  if(actionLabel) t.querySelector('button').onclick=()=>{t.remove(); action()};
  document.body.appendChild(t); clearTimeout(toastT); toastT=setTimeout(()=>t.remove(), 3200);
}
function buzz(ms){try{navigator.vibrate&&navigator.vibrate(ms||12)}catch(e){}}
function topbar(title, back, right){

/* ===== Views ===== */
function render(){

}

/* ---------- Home ---------- */

        <div class="muted cond" style="font-size:22px">vs</div>
        <div class="grow" style="text-align:right"><div class="muted small">${esc(teamName(g.homeId))}</div><div class="bigscore">${t.home}</div></div>
      </div>
      ${matchSeries(m)}
      <button class="btn primary block" data-resume style="margin-top:12px">${g.status==='final' ? (g.n<m.games_total?'Set up Game '+(g.n+1):'Match summary') : g.status==='lineup'?'Set lineups':'Resume game'}</button>
    </div>`;
  }
  $app.innerHTML=`<div class="wrap">
    <div class="top"><div class="title" style="font-size:28px">Dartball Scorebook</div><button class="iconbtn" data-settings aria-label="Settings">⚙</button></div>
    ${cur}

      const res=mm.games.filter(x=>x.final).map(x=>`${x.final.away}-${x.final.home}`).join(', ');
      return `<button class="item" style="width:100%;text-align:left" data-m="${mm.id}"><div class="grow"><div style="font-weight:600">${esc(teamName(mm.awayId))} @ ${esc(teamName(mm.homeId))}</div><div class="muted small">${esc(mm.date)}${res?' · '+res:''}</div></div>${mm.id===S.currentMatchId?'<span class="pill live">Current</span>':''}<span class="muted">›</span></button>`}).join('')}</div>`:''}
    <p class="sync" id="sync" style="text-align:center">${syncText()}</p>
  </div>`;
  const q=s=>$app.querySelector(s);
  q('[data-new]').onclick=()=>go('newmatch');
  q('[data-teams]').onclick=()=>go('teams');
  q('[data-stats]').onclick=()=>go('stats',{scope:'season'});
  q('[data-settings]').onclick=q('[data-settings2]').onclick=()=>go('settings');
  if(q('[data-teams2]')) q('[data-teams2]').onclick=()=>go('teams');
  if(q('[data-resume]')) q('[data-resume]').onclick=()=>resume();
  if(q('#season')){ const mine=Object.values(S.teams).find(t=>t.mine)||Object.values(S.teams)[0]; q('#season').onclick=()=>go('stats',{scope:'season',tid:mine.id}) }
  $app.querySelectorAll('[data-m]').forEach(b=>b.onclick=()=>go('match',{mid:b.dataset.m}));
}
function matchSeries(m){
  const cells=[]; for(let i=0;i<m.games_total;i++){const g=m.games[i]; cells.push(`<span class="pill" style="${g&&g.status==='live'?'border-color:var(--accent);color:var(--accent2)':''}">G${i+1} ${g&&g.final?g.final.away+'-'+g.final.home: g&&g.status==='live'?'live':'—'}</span>`)}
  return `<div class="row" style="flex-wrap:wrap;gap:6px">${cells.join('')}</div>`;

function resume(){
  const m=curMatch(), g=curGame(m);
  if(g.status==='live') return go('game');

function ordinal(n){const s=['th','st','nd','rd'],v=n%100; return n+(s[(v-20)%10]||s[v]||s[0])}

/* ---------- Teams ---------- */
function renderTeams(){
  const ts=Object.values(S.teams).sort((a,b)=>(b.mine?1:0)-(a.mine?1:0)||a.name.localeCompare(b.name));
  $app.innerHTML=`<div class="wrap">${topbar('Teams & rosters',true)}
    <div class="card"><div class="row"><input id="tn" placeholder="New team name" class="grow"><button class="btn primary" id="add">Add</button></div></div>
    ${ts.length?`<div class="card list">${ts.map(t=>`<button class="item" style="width:100%;text-align:left" data-t="${t.id}"><div class="grow"><div style="font-weight:600">${t.mine?'★ ':''}${esc(t.name)}</div><div class="muted small">${t.players.filter(p=>p.active!==false).length} players</div></div><span class="muted">›</span></button>`).join('')}</div>`:`<p class="muted" style="text-align:center">No teams yet.</p>`}

}
function createTeam(name){const t={id:uid(), name, players:[], lastLineup:[], mine:false}; S.teams[t.id]=t; return t}
function addPlayer(t, name){const p={id:uid(), name, active:true}; t.players.push(p); return p}
function renderTeam(){

        <button class="btn sm" data-ren="${p.id}">Rename</button><button class="btn sm" data-act="${p.id}">${p.active===false?'Restore':'Retire'}</button></div>`).join('')||'<p class="muted">No players yet.</p>'}</div>
      <p class="muted small">Retired players keep their stats but leave the bench list.</p>

/* ---------- New match ---------- */
function renderNewMatch(){
  const ts=Object.values(S.teams).sort((a,b)=>(b.mine?1:0)-(a.mine?1:0)||a.name.localeCompare(b.name));
  const mine=ts.find(t=>t.mine);

  bindBack();
  const q=s=>$app.querySelector(s);
  const sync=()=>{q('#awayNew').style.display=q('#away').value==='__new'?'block':'none'; q('#homeNew').style.display=q('#home').value==='__new'?'block':'none'};
  q('#away').onchange=q('#home').onchange=sync; sync();
  q('#go').onclick=()=>{
    const pick=(sel,inp)=>{ if(q(sel).value!=='__new') return q(sel).value; const n=q(inp).value.trim(); if(!n) return null; return createTeam(n).id };
    let a=q('#away').value==='__new'&&!q('#awayNew').value.trim()?null:1, h=q('#home').value==='__new'&&!q('#homeNew').value.trim()?null:1;
    if(!a||!h) return toast('Name the new team first');
    const awayId=pick('#away','#awayNew'), homeId=pick('#home','#homeNew');
    if(awayId===homeId) return toast('Pick two different teams');
    const games=Math.max(1,Math.min(9,+q('#gm').value||3)), innings=Math.max(1,Math.min(15,+q('#inn').value||9));
    settings().games=games; settings().innings=innings;
    const m={id:uid(), created:Date.now(), date:q('#dt').value, awayId, homeId, games_total:games, innings, games:[]};
    m.games.push(newGame(1, awayId, homeId, defaultLineup(awayId), defaultLineup(homeId)));
    S.matches[m.id]=m; S.currentMatchId=m.id; save();
    openLineup('pregame');
  };
}
function defaultLineup(tid){
  const t=team(tid); const active=t.players.filter(p=>p.active!==false).map(p=>p.id);
  const last=(t.lastLineup||[]).filter(id=>active.includes(id));
  return last.length? last : active;
}

function enableDrag(list, arr, rerender){
  if(!list) return;
  list.querySelectorAll('[data-h]').forEach(h=>{
    h.addEventListener('pointerdown', e=>{
      const li=h.closest('li'); e.preventDefault(); h.setPointerCapture(e.pointerId); li.classList.add('dragging');
      const move=ev=>{
        const sibs=[...list.children];
        for(const s of sibs){ if(s===li) continue; const r=s.getBoundingClientRect(); const mid=r.top+r.height/2;
          const idxS=sibs.indexOf(s), idxL=sibs.indexOf(li);
          if(idxS<idxL && ev.clientY<mid){ list.insertBefore(li,s); buzz(6); break }
          if(idxS>idxL && ev.clientY>mid){ list.insertBefore(li,s.nextSibling); buzz(6); break } }
      };
      const up=()=>{h.removeEventListener('pointermove',move); h.removeEventListener('pointerup',up); h.removeEventListener('pointercancel',up);
        const order=[...list.children].map(x=>x.dataset.id); arr.splice(0,arr.length,...order); rerender()};
      h.addEventListener('pointermove',move); h.addEventListener('pointerup',up); h.addEventListener('pointercancel',up);
    });
  });
}
function saveLineup(){
  const m=curMatch(), g=curGame(m);
  for(const k of ['away','home']){
    if(!LE[k].length) return toast(`${teamName(LE[k+'Id'])} needs at least one batter`);
    if(new Set(LE[k]).size!==LE[k].length) return toast('A player is listed twice');
  }
  if(LE.mode==='live'){
    pushUndoLabel(g,'lineup change');
    setLineup(g,'away',LE.away); setLineup(g,'home',LE.home);
    LE=null; save(); go('game'); toast('Batting order saved', 'Undo', ()=>doUndo());
  } else {
    g.awayId=LE.awayId; g.homeId=LE.homeId; g.lineup.away=LE.away.slice(); g.lineup.home=LE.home.slice();
    g.next={away:0,home:0}; g.status='live';
    LE=null; save(); go('game');
  }
}

function miniDiamond(b){

function scoreboard(g, m){

function bindFinal(g,m){

function score(code){
  const m=curMatch(), g=curGame(m);
  const st=Object.assign({},settings(),{innings:m.innings});
  const before={inning:g.inning, half:g.half};
  const res=apply(g, code, st); if(!res) return;
  buzz(code==='HR'?[20,40,20]:14);
  let msg = res.pitch || resLabel(res.pa.r);
  if(res.pa && res.pa.runs.length) msg += ` · ${res.pa.runs.length} run${res.pa.runs.length>1?'s':''}`;
  if(res.pa && res.pa.r==='DP' && res.pa.outs===2) msg='Double Play';
  save();
  if(res.ended){ rememberLineups(g); save(); }
  renderGame();
  const fl=document.getElementById('fl'); if(fl){ fl.textContent=msg; fl.classList.add('show'); setTimeout(()=>fl.classList.remove('show'), 650) }
  if(res.ended) toast('Game over', 'Undo', ()=>doUndo());
  else if(g.half!==before.half) toast(`Side retired — ${g.half===0?'top':'bottom'} of the ${ordinal(g.inning)}`);
}
function rememberLineups(g){ const a=team(g.awayId), h=team(g.homeId); if(a) a.lastLineup=g.lineup.away.slice(); if(h) h.lastLineup=g.lineup.home.slice() }
function doUndo(){
  const m=curMatch(), g=curGame(m);
  if(!g.undo.length){
    if(g.status==='lineup' && m.games.length>1){ return }
    return toast('Nothing to undo');
  }
  const lab=undo(g); save(); renderGame(); toast('Undid '+(lab==='lineup change'?'lineup change':resLabel(lab)));
}
function nextGame(){
  const m=curMatch(), prev=curGame(m);
  if(prev.status!=='final' || prev.n>=m.games_total) return;
  const sides=sidesForGame(prev.n+1, m.awayId, m.homeId);
  const g=newGame(prev.n+1, sides.awayId, sides.homeId, lineupFor(prev,sides.awayId), lineupFor(prev,sides.homeId));
  m.games.push(g); save(); openLineup('pregame');
  toast(`Game ${g.n}: ${teamName(g.homeId)} bats last`);
}

/* ---------- Match report (email / text) ---------- */
function matchReport(m, onlyTid){
  const games=m.games.filter(g=>g.status!=='lineup');
  const d=new Date(m.date+'T12:00:00');
  const lines=[`Dartball — ${isNaN(d)?m.date:d.toLocaleDateString(undefined,{weekday:'short',month:'short',day:'numeric',year:'numeric'})}`,
    `${teamName(m.awayId)} @ ${teamName(m.homeId)}`,''];
  const wins={}; 
  for(const g of games){
    const t=totals(g);
    lines.push(`Game ${g.n}: ${teamName(g.awayId)} ${t.away}, ${teamName(g.homeId)} ${t.home}${g.status==='live'?' (in progress)':''}${g.final&&g.inning>m.innings?` (${g.inning} inn)`:''}`);
    if(g.final && t.away!==t.home){ const w=t.away>t.home?g.awayId:g.homeId; wins[w]=(wins[w]||0)+1 }
  }
  const ids=[m.awayId,m.homeId];
  const wa=wins[m.awayId]||0, wh=wins[m.homeId]||0;
  if(games.length) lines.push(wa===wh? `Series tied ${wa}–${wh}` : `${teamName(wa>wh?m.awayId:m.homeId)} won the series ${Math.max(wa,wh)}–${Math.min(wa,wh)}`);
  const teams = onlyTid? [onlyTid] : ids;
  const hot=[], hrs=[];
  for(const tid of teams){
    const st=statLines(games,tid);
    const h=Object.entries(st).filter(([,l])=>l.AB>0 && l.H/l.AB>=0.5).sort((a,b)=>(b[1].H/b[1].AB)-(a[1].H/a[1].AB)||b[1].H-a[1].H)
      .map(([pid,l])=>`${pname(pid)} ${l.H}-for-${l.AB} (${avg(l)})`);
    const r=Object.entries(st).filter(([,l])=>l.HR>0).sort((a,b)=>b[1].HR-a[1].HR).map(([pid,l])=>pname(pid)+(l.HR>1?` (${l.HR})`:''));
    const lab=teams.length>1?`${teamName(tid)}: `:'';
    hot.push(lab+(h.join(', ')||'none'));
    hrs.push(lab+(r.join(', ')||'none'));
  }
  lines.push('','Hitting .500 or better:',...hot,'','Home runs:',...hrs);
  return lines.join('\n');
}
function shareSheet(m){
  const mine=Object.values(S.teams).find(t=>t.mine && (t.id===m.awayId||t.id===m.homeId));
  let only=false;
  const draw=()=>{
    const txt=matchReport(m, only&&mine?mine.id:null);
    const subj=`Dartball: ${teamName(m.awayId)} @ ${teamName(m.homeId)}`;
    sheet(`<h2>Send scores</h2>
      ${mine?`<label class="row small" style="gap:8px;margin-bottom:8px"><input type="checkbox" id="only" ${only?'checked':''} style="width:auto"> Only list ${esc(mine.name)} hitters</label>`:''}
      <pre id="rep" style="white-space:pre-wrap;background:var(--bg2);border:1px solid var(--line);border-radius:12px;padding:12px;font:14px/1.45 Barlow,system-ui,sans-serif;max-height:40vh;overflow:auto;margin:0">${esc(txt)}</pre>
      <div class="grid2" style="margin-top:12px">
        ${APP?`<button class="btn primary" id="em">✉ Email</button><button class="btn primary" id="tx">💬 Text</button>`:`<a class="btn primary" href="mailto:?subject=${encodeURIComponent(subj)}&body=${encodeURIComponent(txt)}" target="_blank" rel="noopener">✉ Email</a>
        <a class="btn primary" href="sms:?&body=${encodeURIComponent(txt)}" target="_blank" rel="noopener">💬 Text</a>`}
      </div>
      <button class="btn block" id="cp" style="margin-top:8px">Copy summary</button>
      ${APP?`<button class="btn block" id="sh" style="margin-top:8px">Share to another app…</button>`:`<p class="muted small" style="margin:8px 0 0">If Email or Text doesn't open your app, tap Copy and paste it into a message.</p>`}
      <button class="btn block ghost" data-x style="margin-top:6px">Close</button>`, el=>{
        el.querySelector('[data-x]').onclick=closeSheet;
        const o=el.querySelector('#only'); if(o) o.onchange=()=>{only=o.checked; draw()};
        if(APP){ el.querySelector('#em').onclick=()=>AndroidApp.email(subj,txt); el.querySelector('#tx').onclick=()=>AndroidApp.sms(txt); el.querySelector('#sh').onclick=()=>AndroidApp.share(subj,txt); }
        el.querySelector('#cp').onclick=async()=>{if(APP){AndroidApp.copy(txt); return toast('Copied — paste it into a text or email')} try{await navigator.clipboard.writeText(txt); toast('Copied — paste it into a text or email')}catch(e){
          const r=document.createRange(); r.selectNodeContents(el.querySelector('#rep')); const sel=getSelection(); sel.removeAllRanges(); sel.addRange(r); toast('Text selected — tap Copy')}};
      });
  };
  draw();
}

/* ---------- Stats ---------- */
function renderStats(){
  const scope=view.scope||'season';
  let games=[], title='Season stats', teamIds=[];
  if(scope==='match'){
    const m=S.matches[view.mid]; if(!m) return go('home');
    const gi=view.gi===undefined?'all':view.gi;
    games = gi==='all'? m.games : [m.games[gi]];
    title = gi==='all'? `Combined · ${m.games.length} game${m.games.length>1?'s':''}` : `Game ${+gi+1} box score`;
    teamIds=[m.awayId, m.homeId];
    view.gi=gi;
  } else {
    for(const m of Object.values(S.matches)) games.push(...m.games);
    teamIds=Object.keys(S.teams).sort((a,b)=>(S.teams[b].mine?1:0)-(S.teams[a].mine?1:0));
  }
  const tsel = view.tid && teamIds.includes(view.tid) ? view.tid : teamIds[0];
  const cols=['AVG','G','AB','H','1B','2B','3B','HR','2BS','CC','R','RBI','BB','K','SH'];
  const colLabel=c=>c==='CC'?esc(ccLabel()):c;
  const table=(tid)=>{
    const lines=statLines(games.filter(Boolean), tid);
    const rate=l=>l.AB?l.H/l.AB:-1; const ids=Object.keys(lines).sort((a,b)=>(rate(lines[b])-rate(lines[a]))||(lines[b].H-lines[a].H)||(lines[b].AB-lines[a].AB));
    if(!ids.length) return '<p class="muted">No at-bats yet.</p>';
    const tot=emptyLine(); ids.forEach(id=>{for(const c in tot) tot[c]+=lines[id][c]});
    const cellv=(l,c)=>c==='AVG'?`<b style="color:var(--accent2)">${avg(l)}</b>`:l[c];
    return `<div class="st"><table><tr><th>Player</th>${cols.map(c=>`<th>${colLabel(c)}</th>`).join('')}</tr>
      ${ids.map(id=>`<tr><td>${esc(pname(id))}</td>${cols.map(c=>`<td>${cellv(lines[id],c)}</td>`).join('')}</tr>`).join('')}
      <tr class="tot"><td>Team</td>${cols.map(c=>`<td>${c==='G'?'':cellv(tot,c)}</td>`).join('')}</tr></table></div>`;
  };
  let gameTabs='';
  if(scope==='match'){
    const m=S.matches[view.mid];
    gameTabs=`<div class="tabs">${m.games.map((g,i)=>`<button data-gi="${i}" class="${view.gi===i?'on':''}">G${i+1}</button>`).join('')}<button data-gi="all" class="${view.gi==='all'?'on':''}">All</button></div>`;
  }
  const lineScore = scope==='match' && view.gi!=='all' && games[0] ? `<div class="card" style="padding:10px">${scoreboard(games[0], S.matches[view.mid])}</div>`:'';
  $app.innerHTML=`<div class="wrap">${topbar(title,true)}
    ${gameTabs}${lineScore}
    ${scope==='match' ? teamIds.map(tid=>`<div class="card"><h3>${esc(teamName(tid))}</h3>${table(tid)}</div>`).join('') :
      `${teamIds.length?`<div class="card hero"><div class="row"><div class="grow"><div class="muted small">${esc(teamName(tsel))} · season</div><div class="bigscore">${teamSeason(tsel).avg}</div><div class="muted small">team batting average</div></div><div style="text-align:right"><div class="cond" style="font-size:26px;font-weight:700">${teamSeason(tsel).w}–${teamSeason(tsel).l}</div><div class="muted small">W–L · ${teamSeason(tsel).h}/${teamSeason(tsel).ab} hits</div></div></div></div><div class="tabs" style="overflow-x:auto">${teamIds.map(t=>`<button data-tid="${t}" class="${t===tsel?'on':''}">${esc(teamName(t))}</button>`).join('')}</div><div class="card">${table(tsel)}</div>`:'<p class="muted">No teams yet.</p>'}`}
    <p class="muted small">2BS = two-base single · ${esc(ccLabel())} = ${esc(settings().ccName)} · SH = sacrifice fly. Stats always follow the player, even after lineup changes.</p>
  </div>`;
  bindBack(()=>{ if(view.back==='game') go('game'); else if(view.back==='match') go('match',{mid:view.mid}); else go('home') });
  $app.querySelectorAll('[data-gi]').forEach(b=>b.onclick=()=>{view.gi=b.dataset.gi==='all'?'all':+b.dataset.gi; render()});
  $app.querySelectorAll('[data-tid]').forEach(b=>b.onclick=()=>{view.tid=b.dataset.tid; render()});
}

function teamSeason(tid){
  const games=[]; for(const m of Object.values(S.matches)) games.push(...m.games.filter(g=>g.status!=='lineup'));
  const lines=statLines(games,tid); const t=emptyLine(); Object.values(lines).forEach(l=>{for(const c in t) t[c]+=l[c]});
  let w=0,l=0; for(const g of games){ if(!g.final) continue; const me=g.awayId===tid?'away':g.homeId===tid?'home':null; if(!me) continue; const op=me==='away'?'home':'away'; if(g.final[me]>g.final[op]) w++; else if(g.final[me]<g.final[op]) l++; }
  const top=Object.entries(lines).filter(([,x])=>x.AB>0).sort((a,b)=>(b[1].H/b[1].AB)-(a[1].H/a[1].AB)||b[1].H-a[1].H).slice(0,3);
  return {avg:avg(t), h:t.H, ab:t.AB, r:t.R, w, l, top, games:games.filter(g=>g.awayId===tid||g.homeId===tid).length};
}
function seasonCard(){
  const ts=Object.values(S.teams); const mine=ts.find(t=>t.mine)||ts[0]; if(!mine) return '';
  const x=teamSeason(mine.id); if(!x.games) return '';
  return `<button class="card" id="season" style="width:100%;text-align:left;display:block">
    <div class="row"><div class="grow"><h3 style="margin:0">${esc(mine.name)} · season</h3></div><span class="muted">›</span></div>

}

function restore(text){
  try{const o=JSON.parse(text); if(!o||!o.teams||!o.matches) throw 0;
    ask('Restore this backup?', `It has ${Object.keys(o.teams).length} teams and ${Object.keys(o.matches).length} matches, and replaces what's here now.`, 'Restore', ()=>{
      o.settings=Object.assign(deep(DEFAULT_SETTINGS),o.settings||{}); for(const m of Object.values(o.matches)) for(const g of m.games) g.undo=g.undo||[];
      S=o; save(); queueCloud(true); go('home'); toast('Backup restored')});
  }catch(e){toast("That doesn't look like a scorebook backup")}
}

/* ===== Boot ===== */
window.appBack=()=>{ if($layer.innerHTML){closeSheet(); return true} const b=$app.querySelector('[data-back]'); if(b){b.click(); return true} return false };
render();
initCloud();
WIDE_Q.addEventListener('change',()=>{ if(view.name==='lineup') render() });
window.addEventListener('beforeunload',()=>{try{localStorage.setItem(LS_KEY, JSON.stringify(S))}catch(e){}});
</script>
</body>
